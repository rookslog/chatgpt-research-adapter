name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Authority
        run: npm run check:authority
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          find bin scripts src test -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Package dry run
        run: npm pack --dry-run --json --ignore-scripts > /tmp/chatgpt-research-pack.json
